<style>
/* ════════════════════════════════════════
   THEME VARIABLES
════════════════════════════════════════ */
:root {
  --bg:      #080c10;
  --bg2:     #0d1117;
  --surface: #131c26;
  --border:  rgba(255,255,255,0.07);
  --accent:  #00d4ff;
  --accent2: #7c3aed;
  --grad:    linear-gradient(135deg,#00d4ff,#7c3aed);
  --text:    #e8edf2;
  --muted:   #6b7f94;
  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', sans-serif;
  --cursor-color: #00d4ff;
}
[data-theme="light"] {
  --bg:      #f5f7fa;
  --bg2:     #edf0f4;
  --surface: #ffffff;
  --border:  rgba(0,0,0,0.08);
  --text:    #111827;
  --muted:   #6b7280;
  --cursor-color: #7c3aed;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16px;
  line-height: 1.7; overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ════════════════════════════════════════
   LOADING SCREEN
════════════════════════════════════════ */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: #080c10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1.2rem;
  transition: opacity .5s ease, visibility .5s ease;
}
#loader.hide { opacity: 0; visibility: hidden; }
.loader-logo {
  font-family: var(--font-display); font-weight: 800; font-size: 4rem;
  letter-spacing: -0.04em;
  background: var(--grad);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: loaderPulse 1s ease-in-out infinite alternate;
}
@keyframes loaderPulse { from{opacity:.5;transform:scale(.97)} to{opacity:1;transform:scale(1)} }
.loader-bar-wrap { width: 160px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.loader-bar { height: 100%; border-radius: 3px; background: var(--grad); animation: loaderFill 1.2s ease forwards; }
@keyframes loaderFill { from{width:0} to{width:100%} }
.loader-text { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: #3d5166; }

/* ════════════════════════════════════════
   CUSTOM CURSOR
════════════════════════════════════════ */
.cursor-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--cursor-color);
  position: fixed; pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%); transition: transform .1s, opacity .2s;
}
.cursor-ring {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--cursor-color);
  position: fixed; pointer-events: none; z-index: 9997;
  transform: translate(-50%,-50%);
  transition: all .15s ease, transform .15s ease; opacity: .5;
}
.cursor-ring.hovered { transform: translate(-50%,-50%) scale(1.5); opacity: .3; }
@media (hover: none) { .cursor-dot, .cursor-ring { display: none; } }

/* ════════════════════════════════════════
   SCROLL PROGRESS
════════════════════════════════════════ */
#scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: var(--grad); z-index: 200;
  transition: width .08s linear; border-radius: 0 2px 2px 0;
}

/* ════════════════════════════════════════
   NOISE OVERLAY
════════════════════════════════════════ */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* ════════════════════════════════════════
   NAV
════════════════════════════════════════ */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.2rem 6vw;
  background: rgba(8,12,16,0.88); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); transition: background .3s;
}
[data-theme="light"] nav { background: rgba(245,247,250,0.92); }
.nav-logo {
  font-family: var(--font-display); font-weight: 800; font-size: 1.4rem;
  background: var(--grad); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.02em;
}
.nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
.nav-links a {
  color: var(--muted); text-decoration: none; font-size: .875rem;
  font-weight: 500; letter-spacing: .04em; text-transform: uppercase; transition: color .2s;
}
.nav-links a:hover { color: var(--accent); }
.theme-toggle {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; padding: .35rem .7rem;
  cursor: pointer; font-size: 1rem; line-height: 1;
  transition: border-color .2s, background .3s; display: flex; align-items: center;
}
.theme-toggle:hover { border-color: var(--accent); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
.hamburger span { width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: .3s; }

/* ════════════════════════════════════════
   HERO
════════════════════════════════════════ */
#hero {
  min-height: 100vh; display: flex; align-items: center;
  padding: 8rem 6vw 5rem; position: relative; overflow: hidden;
}
.hero-glow {
  position: absolute; width: 700px; height: 700px; border-radius: 50%;
  background: radial-gradient(circle,rgba(0,212,255,0.07) 0%,transparent 70%);
  top: -150px; right: -150px; pointer-events: none;
}
.hero-glow2 {
  position: absolute; width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle,rgba(124,58,237,0.07) 0%,transparent 70%);
  bottom: -50px; left: 5%; pointer-events: none;
}
.hero-grid-lines {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size: 60px 60px;
}
.hero-code-float {
  position: absolute; right: 4vw; bottom: 12%;
  background: rgba(13,17,23,0.88); border: 1px solid rgba(0,212,255,0.15);
  border-radius: 12px; padding: 1rem 1.4rem;
  font-family: 'Courier New',monospace; font-size: .72rem; line-height: 1.8;
  color: var(--muted); pointer-events: none;
  animation: floatCode 6s ease-in-out infinite;
  backdrop-filter: blur(8px); z-index: 1; max-width: 240px;
}
.hero-code-float .c-kw  { color: #7c3aed; }
.hero-code-float .c-fn  { color: #00d4ff; }
.hero-code-float .c-str { color: #34d399; }
.hero-code-float .c-cm  { color: #3d5166; font-style: italic; }
@keyframes floatCode { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.hero-badge-float {
  position: absolute; left: 5vw; bottom: 18%;
  background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.25);
  border-radius: 10px; padding: .65rem 1.1rem; font-size: .75rem; color: #a78bfa;
  pointer-events: none; animation: floatBadge 7s ease-in-out infinite;
  backdrop-filter: blur(8px); z-index: 1; display: flex; align-items: center; gap: .5rem;
}
@keyframes floatBadge { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-10px) rotate(1deg)} }
.hero-inner {
  display: flex; align-items: center;
  justify-content: space-between; gap: 3rem; width: 100%;
  position: relative; z-index: 1;
}
.hero-text { flex: 1; }
.hero-photo-wrap {
  flex-shrink: 0; position: relative;
  animation: floatPhoto 5s ease-in-out infinite;
}
@keyframes floatPhoto { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.hero-photo-wrap::before {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  background: var(--grad); z-index: 0; animation: spinRing 8s linear infinite;
}
@keyframes spinRing { to{transform:rotate(360deg)} }
.hero-photo-wrap::after {
  content: ''; position: absolute; inset: -24px; border-radius: 50%;
  background: radial-gradient(circle,rgba(0,212,255,0.18) 0%,transparent 70%); z-index: 0;
}
.hero-photo {
  width: 240px; height: 240px; border-radius: 50%;
  object-fit: cover; object-position: center 5%;
  position: relative; z-index: 1; display: block; outline: 4px solid var(--bg);
}
.hero-badge {
  display: inline-flex; align-items: center; gap: .5rem;
  background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
  border-radius: 100px; padding: .35rem 1rem; font-size: .8rem;
  color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 1.5rem;
}
.hero-badge::before { content: '●'; font-size: .5rem; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.hero-name {
  font-family: var(--font-display); font-size: clamp(4rem,10vw,9rem);
  font-weight: 800; line-height: .95; letter-spacing: -0.04em;
  background: var(--grad); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: .3rem;
}
.hero-subname {
  font-family: var(--font-display); font-size: clamp(1rem,2vw,1.3rem);
  font-weight: 400; color: var(--muted); letter-spacing: .1em;
  text-transform: uppercase; margin-bottom: 1rem;
}
.hero-tagline {
  font-size: clamp(.88rem,1.4vw,1rem); color: var(--text);
  font-weight: 400; max-width: 480px; line-height: 1.8; margin-bottom: .75rem; min-height: 1.6em;
}
.typing-text { border-right: 2px solid var(--accent); padding-right: 2px; }
.hero-intro { font-size: .88rem; color: var(--muted); max-width: 440px; margin-bottom: 2rem; }
.hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0; }
.btn-primary {
  display: inline-flex; align-items: center; gap: .5rem;
  background: var(--grad); color: #fff; text-decoration: none;
  padding: .8rem 1.8rem; border-radius: 8px;
  font-weight: 600; font-size: .9rem; letter-spacing: .02em;
  transition: opacity .2s, transform .2s; border: none; cursor: pointer;
}
.btn-primary:hover { opacity: .85; transform: translateY(-2px); }
.btn-outline {
  display: inline-flex; align-items: center; gap: .5rem;
  border: 1px solid var(--border); color: var(--text);
  text-decoration: none; padding: .8rem 1.8rem; border-radius: 8px;
  font-weight: 500; font-size: .9rem; background: transparent; cursor: pointer;
  transition: border-color .2s, color .2s, transform .2s;
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.btn-cv {
  display: inline-flex; align-items: center; gap: .5rem;
  border: 1px solid rgba(52,211,153,0.35); color: #34d399;
  text-decoration: none; padding: .8rem 1.8rem; border-radius: 8px;
  font-weight: 500; font-size: .9rem;
  transition: border-color .2s, background .2s, transform .2s;
}
.btn-cv:hover { border-color: #34d399; background: rgba(52,211,153,0.08); transform: translateY(-2px); }

/* ════════════════════════════════════════
   SECTIONS
════════════════════════════════════════ */
section { padding: 6rem 6vw; position: relative; z-index: 1; }
section:nth-child(even) { background: var(--bg2); }
.section-label { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: .6rem; font-weight: 600; }
.section-title { font-family: var(--font-display); font-size: clamp(2rem,4vw,3rem); font-weight: 800; letter-spacing: -0.03em; color: var(--text); margin-bottom: 1rem; line-height: 1.1; }
.divider { width: 60px; height: 3px; background: var(--grad); border-radius: 3px; margin-bottom: 2.5rem; }

/* ════════════════════════════════════════
   ABOUT
════════════════════════════════════════ */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
.about-text p { color: var(--muted); margin-bottom: 1rem; font-size: .95rem; line-height: 1.85; }
.about-text p strong { color: var(--text); font-weight: 500; }
.sti-badge {
  display: inline-flex; align-items: center; gap: .5rem;
  background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.25);
  border-radius: 8px; padding: .5rem 1rem; font-size: .82rem;
  color: #a78bfa; font-weight: 500; margin-bottom: 1.2rem;
}
.about-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.5rem; transition: border-color .2s;
}
.stat-card:hover { border-color: rgba(0,212,255,0.3); }
.stat-icon { font-size: 1.5rem; margin-bottom: .5rem; }
.stat-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-bottom: .2rem; }
.stat-text { font-size: .8rem; color: var(--muted); }
.learning-strip {
  margin-top: 1.5rem; background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: 8px;
  padding: .9rem 1.2rem; font-size: .85rem; color: var(--muted);
}
.learning-strip strong { color: var(--accent); }

/* ════════════════════════════════════════
   TESTIMONIALS (live system)
════════════════════════════════════════ */
.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.25rem; margin-bottom: 3rem;
}
.testimonial-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 1.75rem;
  position: relative; transition: border-color .2s, transform .2s;
}
.testimonial-card:hover { border-color: rgba(0,212,255,0.25); transform: translateY(-3px); }
.testimonial-card::before {
  content: '"'; position: absolute; top: .8rem; left: 1.2rem;
  font-family: var(--font-display); font-size: 4rem; line-height: 1;
  background: var(--grad); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text; opacity: .3;
}
.t-message { font-size: .9rem; color: var(--muted); line-height: 1.75; font-style: italic; padding-top: 1.2rem; margin-bottom: 1.2rem; }
.t-author { display: flex; align-items: center; gap: .75rem; }
.t-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: .85rem; color: #fff; flex-shrink: 0;
}
.t-name { font-weight: 600; font-size: .875rem; }
.t-role { font-size: .75rem; color: var(--muted); }
.t-empty {
  text-align: center; padding: 3rem; color: var(--muted);
  font-size: .9rem; border: 1px dashed var(--border); border-radius: 16px;
  grid-column: 1 / -1;
}
.t-submit-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2rem; margin-top: 1rem;
}
.t-submit-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin-bottom: 1.2rem; }
.t-form { display: flex; flex-direction: column; gap: .85rem; }
.t-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
.t-field { display: flex; flex-direction: column; gap: .35rem; }
.t-field label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.t-field input, .t-field textarea {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: .7rem .9rem; color: var(--text);
  font-family: var(--font-body); font-size: .88rem; outline: none;
  resize: vertical; transition: border-color .2s;
}
.t-field input:focus, .t-field textarea:focus { border-color: var(--accent); }
.t-field textarea { min-height: 90px; }
.t-submit-btn {
  background: var(--grad); border: none; color: #fff;
  padding: .8rem; border-radius: 8px; font-weight: 600;
  font-size: .9rem; cursor: pointer; transition: opacity .2s, transform .2s; width: 100%;
}
.t-submit-btn:hover { opacity: .85; transform: translateY(-2px); }
.t-submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.t-success-msg {
  display: none; background: rgba(52,211,153,0.08);
  border: 1px solid rgba(52,211,153,0.25); border-radius: 8px;
  padding: 1rem; text-align: center; color: #34d399; font-size: .88rem; line-height: 1.6;
}
.t-success-msg.show { display: block; }
@media (max-width: 640px) { .t-form-row { grid-template-columns: 1fr; } }

/* ════════════════════════════════════════
   SKILLS
════════════════════════════════════════ */
.skills-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }
.skill-category {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 1.8rem; transition: border-color .2s, transform .2s;
}
.skill-category:hover { border-color: rgba(0,212,255,0.25); transform: translateY(-4px); }
.skill-cat-title { font-family: var(--font-display); font-weight: 700; font-size: .95rem; margin-bottom: 1.2rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.skill-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: .9rem; }
.skill-name { font-size: .875rem; color: var(--text); }
.skill-bar-wrap { width: 120px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.skill-bar { height: 100%; border-radius: 4px; background: var(--grad); }
.skill-tags { display: flex; flex-wrap: wrap; gap: .5rem; }
.skill-tag {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 100px; padding: .3rem .8rem; font-size: .78rem;
  color: var(--muted); transition: border-color .2s, color .2s;
}
.skill-tag:hover { border-color: var(--accent); color: var(--accent); }

/* ════════════════════════════════════════
   PROJECTS
════════════════════════════════════════ */
.projects-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 1.5rem; }
.project-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2rem; display: flex; flex-direction: column;
  transition: border-color .25s, transform .25s; position: relative; overflow: hidden;
}
.project-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg,rgba(0,212,255,0.03),transparent);
  opacity: 0; transition: opacity .3s;
}
.project-card:hover { border-color: rgba(0,212,255,0.35); transform: translateY(-6px); }
.project-card:hover::before { opacity: 1; }
.project-status {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 600; padding: .25rem .75rem; border-radius: 100px;
  margin-bottom: 1rem; width: fit-content;
}
.status-done { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
.status-ongoing { background: rgba(124,58,237,0.1); color: #a78bfa; border: 1px solid rgba(124,58,237,0.25); }
.status-ongoing::before { content: '●'; font-size: .45rem; animation: blink 1.5s infinite; }
.project-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: .6rem; letter-spacing: -0.01em; }
.project-desc { font-size: .875rem; color: var(--muted); flex: 1; line-height: 1.7; margin-bottom: 1.2rem; }
.project-tech { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 0; }
.tech-chip {
  background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.15);
  color: var(--accent); font-size: .72rem; padding: .2rem .65rem;
  border-radius: 6px; font-weight: 500; letter-spacing: .03em;
}

/* ════════════════════════════════════════
   SOCIAL
════════════════════════════════════════ */
.social-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
.social-btn {
  display: flex; align-items: center; gap: .6rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: .75rem 1.4rem;
  text-decoration: none; color: var(--text); font-size: .875rem; font-weight: 500;
  transition: border-color .2s, color .2s, transform .2s;
}
.social-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }
.social-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* ════════════════════════════════════════
   CONTACT
════════════════════════════════════════ */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
.contact-info p { color: var(--muted); font-size: .95rem; margin-bottom: 1.5rem; }
.contact-email {
  display: inline-flex; align-items: center; gap: .6rem;
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 600;
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid rgba(0,212,255,0.3); padding-bottom: .2rem; transition: border-color .2s;

<!-- ────────────────────────────────────────
  SCRIPT — paste before </body>
  Keys come from config.js — never hardcode them here
──────────────────────────────────────── -->
<script>
/* ── TESTIMONIALS (JSONBin) ──
   CONFIG.BIN_ID and CONFIG.API_KEY come from config.js
   which is in .gitignore and never pushed to GitHub      */

(function() {
  /* Safety check — warn in console if config.js isn't loaded */
  if (typeof CONFIG === 'undefined' || !CONFIG.BIN_ID || !CONFIG.API_KEY) {
    console.warn('Testimonials: CONFIG not found. Make sure config.js is loaded before this script.');
    const grid = document.getElementById('testimonialsGrid');
    if (grid) grid.innerHTML = '<div class="t-empty">Testimonials unavailable — config missing.</div>';
    return;
  }

  const BIN_URL = `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`;
  const HEADERS_READ  = { 'X-Master-Key': CONFIG.API_KEY };
  const HEADERS_WRITE = { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.API_KEY };

  /* ── Load & render approved testimonials ── */
  async function loadTestimonials() {
    const grid = document.getElementById('testimonialsGrid');
    try {
      const res  = await fetch(BIN_URL + '/latest', { headers: HEADERS_READ });
      const json = await res.json();
      const approved = (json.record?.testimonials || [])
        .filter(t => t.status === 'approved')
        .reverse(); /* newest first */

      if (!approved.length) {
        grid.innerHTML = '<div class="t-empty">No testimonials yet — be the first to leave one below! 👇</div>';
        return;
      }

      grid.innerHTML = approved.map(t => `
        <div class="testimonial-card">
          <div class="t-message">${escHtml(t.message)}</div>
          <div class="t-author">
            <div class="t-avatar">${t.name.charAt(0).toUpperCase()}</div>
            <div>
              <div class="t-name">${escHtml(t.name)}</div>
              <div class="t-role">${escHtml(t.role || 'Visitor')}</div>
            </div>
          </div>
        </div>
      `).join('');
    } catch(err) {
      console.error('Failed to load testimonials:', err);
      grid.innerHTML = '<div class="t-empty">Could not load testimonials right now.</div>';
    }
  }

  /* ── Submit new testimonial (saves as pending) ── */
  document.getElementById('testimonialForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn        = document.getElementById('tSubmitBtn');
    const successMsg = document.getElementById('tSuccessMsg');

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      /* Fetch current bin data */
      const res  = await fetch(BIN_URL + '/latest', { headers: HEADERS_READ });
      const json = await res.json();
      const data = json.record || { testimonials: [] };

      /* Append new submission as pending */
      const fd = new FormData(this);
      data.testimonials.push({
        id:      Date.now().toString(),
        name:    fd.get('name').trim(),
        role:    (fd.get('role') || '').trim(),
        message: fd.get('message').trim(),
        status:  'pending',
        date:    new Date().toISOString()
      });

      /* Save back to JSONBin */
      await fetch(BIN_URL, {
        method:  'PUT',
        headers: HEADERS_WRITE,
        body:    JSON.stringify(data)
      });

      this.reset();
      btn.style.display = 'none';
      successMsg.classList.add('show');

    } catch(err) {
      console.error('Submit failed:', err);
      btn.disabled = false;
      btn.textContent = 'Submit Testimonial';
      alert('Something went wrong. Please try again or email me directly.');
    }
  });

  /* ── Escape HTML to prevent XSS ── */
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  loadTestimonials();
})();
</script>
