<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Ren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #131c26;
    --border: rgba(255,255,255,0.08);
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --grad: linear-gradient(135deg, #00d4ff, #7c3aed);
    --text: #e8edf2;
    --muted: #6b7f94;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      var(--bg);
    background-size: 60px 60px;
    color: var(--text);
    font-family: var(--font-body);
  }
  main {
    width: min(620px, 100%);
    text-align: center;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 1.5rem;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 800;
    color: #fff;
    background: var(--grad);
  }
  p:first-of-type {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .2em;
    font-size: .75rem;
    font-weight: 700;
    margin-bottom: .8rem;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 10vw, 5.5rem);
    line-height: .95;
    letter-spacing: -0.04em;
    margin-bottom: 1rem;
  }
  .copy {
    max-width: 460px;
    margin: 0 auto 2rem;
    color: var(--muted);
    line-height: 1.7;
  }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: .85rem 1.4rem;
    border-radius: 8px;
    background: var(--grad);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    transition: transform .2s, opacity .2s;
  }
  a:hover { transform: translateY(-2px); opacity: .86; }
</style>
</head>
<body>
  <main>
    <div class="logo">R</div>
    <p>404</p>
    <h1>Page Not Found</h1>
    <p class="copy">That page does not exist, but the portfolio is still right where it should be.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
