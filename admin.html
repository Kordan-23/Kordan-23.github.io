<!-- Admin.html-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Testimonials | Ren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10; --bg2: #0d1117; --surface: #131c26;
    --border: rgba(255,255,255,0.08);
    --accent: #00d4ff; --accent2: #7c3aed;
    --grad: linear-gradient(135deg,#00d4ff,#7c3aed);
    --text: #e8edf2; --muted: #6b7f94;
    --green: #34d399; --red: #f87171;
    --font-display: 'Syne',sans-serif; --font-body: 'DM Sans',sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .login-card {
    width: min(420px,100%); background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem; text-align: center;
  }
  .login-logo {
    width: 60px; height: 60px; border-radius: 14px; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: #fff;
    margin: 0 auto 1.5rem;
  }
  .login-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: .4rem; }
  .login-sub { color: var(--muted); font-size: .85rem; margin-bottom: 2rem; }
  .login-input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: .85rem 1rem; color: var(--text);
    font-family: var(--font-body); font-size: .95rem; outline: none;
    transition: border-color .2s; margin-bottom: 1rem;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; background: var(--grad); border: none; color: #fff;
    padding: .85rem; border-radius: 10px; font-weight: 600; font-size: .95rem;
    cursor: pointer; transition: opacity .2s;
  }
  .login-btn:hover { opacity: .85; }
  .login-error { color: var(--red); font-size: .82rem; margin-top: .75rem; display: none; }

  /* ADMIN PANEL */
  #admin-panel { display: none; }
  header {
    background: rgba(8,12,16,0.9); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border); padding: 1rem 4vw;
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .header-logo { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .header-badge { font-size: .75rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: .3rem .8rem; }
  .logout-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: .4rem .9rem; cursor: pointer; font-size: .8rem; transition: border-color .2s, color .2s; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  main { padding: 3rem 4vw; max-width: 900px; margin: 0 auto; }
  .page-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; margin-bottom: .4rem; }
  .page-sub { color: var(--muted); font-size: .9rem; margin-bottom: 2.5rem; }

  .tabs { display: flex; gap: .5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab {
    padding: .6rem 1.2rem; border-radius: 8px 8px 0 0; font-size: .875rem; font-weight: 500;
    cursor: pointer; border: 1px solid transparent; border-bottom: none; color: var(--muted);
    background: none; transition: color .2s; position: relative; bottom: -1px;
  }
  .tab.active { color: var(--accent); border-color: var(--border); border-bottom-color: var(--bg); background: var(--bg); }
  .tab-count { font-size: .7rem; background: rgba(0,212,255,0.1); color: var(--accent); border-radius: 100px; padding: .15rem .5rem; margin-left: .4rem; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .testimonial-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.5rem; margin-bottom: 1rem; position: relative;
  }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .75rem; gap: 1rem; }
  .item-author { display: flex; align-items: center; gap: .75rem; }
  .item-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: .85rem; color: #fff; flex-shrink: 0;
  }
  .item-name { font-weight: 600; font-size: .9rem; }
  .item-role { font-size: .78rem; color: var(--muted); }
  .item-date { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .item-message { font-size: .9rem; color: var(--muted); line-height: 1.7; font-style: italic; }
  .item-actions { display: flex; gap: .6rem; margin-top: 1.1rem; }

  .btn-approve {
    display: inline-flex; align-items: center; gap: .4rem;
    background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3);
    color: var(--green); border-radius: 8px; padding: .5rem 1rem;
    font-size: .82rem; font-weight: 500; cursor: pointer; transition: background .2s;
  }
  .btn-approve:hover { background: rgba(52,211,153,0.2); }
  .btn-delete {
    display: inline-flex; align-items: center; gap: .4rem;
    background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25);
    color: var(--red); border-radius: 8px; padding: .5rem 1rem;
    font-size: .82rem; font-weight: 500; cursor: pointer; transition: background .2s;
  }
  .btn-delete:hover { background: rgba(248,113,113,0.18); }

  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--muted); font-size: .9rem;
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }

  .status-badge {
    font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    padding: .25rem .7rem; border-radius: 100px; width: fit-content;
  }
  .badge-pending { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
  .badge-approved { background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }

  .toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1.3rem; font-size: .875rem; color: var(--text);
    transform: translateY(100px); opacity: 0; transition: all .3s ease;
    display: flex; align-items: center; gap: .6rem; max-width: 300px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(52,211,153,0.4); }
  .toast.error { border-color: rgba(248,113,113,0.4); }

  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: .9rem; }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">R</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Testimonial moderation for kordan-23.github.io</div>
    <input type="password" class="login-input" id="passwordInput" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Sign In →</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <header>
    <div class="header-logo">REN · Admin</div>
    <div class="header-right">
      <span class="header-badge" id="adminBadge">Testimonials</span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <div class="page-title">Testimonials</div>
    <div class="page-sub">Review, approve, or delete visitor submissions.</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('pending')" id="tab-pending">
        Pending <span class="tab-count" id="count-pending">0</span>
      </button>
      <button class="tab" onclick="switchTab('approved')" id="tab-approved">
        Approved <span class="tab-count" id="count-approved">0</span>
      </button>
    </div>

    <div class="tab-content active" id="content-pending">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
    <div class="tab-content" id="content-approved">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* ── CONFIG loaded from config.js ── */
const ADMIN_PASSWORD = (typeof CONFIG !== 'undefined') ? CONFIG.ADMIN_PASSWORD : '';
const BIN_ID   = (typeof CONFIG !== 'undefined') ? CONFIG.BIN_ID  : '';
const API_KEY  = (typeof CONFIG !== 'undefined') ? CONFIG.API_KEY : '';
const BIN_URL  = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let allData = { testimonials: [] };

/* ── AUTH ── */
function login() {
  const val = document.getElementById('passwordInput').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    sessionStorage.setItem('adminAuth', '1');
    loadData();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  }
}
function logout() {
  sessionStorage.removeItem('adminAuth');
  location.reload();
}
if (sessionStorage.getItem('adminAuth')) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  loadData();
}

/* ── DATA ── */
async function loadData() {
  try {
    const res = await fetch(BIN_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
    const json = await res.json();
    allData = json.record || { testimonials: [] };
    renderAll();
  } catch(e) {
    showToast('Failed to load data. Check your BIN_ID and API_KEY.', 'error');
  }
}

async function saveData() {
  await fetch(BIN_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
    body: JSON.stringify(allData)
  });
}

/* ── RENDER ── */
function renderAll() {
  const pending  = allData.testimonials.filter(t => t.status === 'pending');
  const approved = allData.testimonials.filter(t => t.status === 'approved');
  document.getElementById('count-pending').textContent  = pending.length;
  document.getElementById('count-approved').textContent = approved.length;
  renderList('content-pending', pending, true);
  renderList('content-approved', approved, false);
}

function renderList(containerId, items, isPending) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">${isPending ? '📬' : '✅'}</div>${isPending ? 'No pending submissions.' : 'No approved testimonials yet.'}</div>`;
    return;
  }
  el.innerHTML = items.map(t => `
    <div class="testimonial-item" id="item-${t.id}">
      <div class="item-header">
        <div class="item-author">
          <div class="item-avatar">${t.name.charAt(0).toUpperCase()}</div>
          <div>
            <div class="item-name">${escHtml(t.name)}</div>
            <div class="item-role">${escHtml(t.role || 'Visitor')}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;">
          <span class="status-badge ${isPending ? 'badge-pending' : 'badge-approved'}">${isPending ? 'Pending' : 'Approved'}</span>
          <div class="item-date">${formatDate(t.date)}</div>
        </div>
      </div>
      <div class="item-message">"${escHtml(t.message)}"</div>
      <div class="item-actions">
        ${isPending ? `<button class="btn-approve" onclick="approve('${t.id}')">✓ Approve</button>` : ''}
        <button class="btn-delete" onclick="deleteItem('${t.id}')">✕ Delete</button>
      </div>
    </div>
  `).join('');
}

/* ── ACTIONS ── */
async function approve(id) {
  const t = allData.testimonials.find(x => x.id === id);
  if (!t) return;
  t.status = 'approved';
  await saveData();
  renderAll();
  showToast('✓ Testimonial approved — now live on your site!', 'success');
}

async function deleteItem(id) {
  if (!confirm('Delete this testimonial? This cannot be undone.')) return;
  allData.testimonials = allData.testimonials.filter(x => x.id !== id);
  await saveData();
  renderAll();
  showToast('Testimonial deleted.', 'error');
}

/* ── TABS ── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-' + tab).classList.add('active');
}

/* ── HELPERS ── */
function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
  catch { return iso; }
}
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
